name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HelpDesk.Api.Tests/HelpDesk.Api.Tests.csproj
      - run: dotnet build HelpDesk.Api.Tests/HelpDesk.Api.Tests.csproj -c Release --no-restore
      - run: dotnet test HelpDesk.Api.Tests/HelpDesk.Api.Tests.csproj -c Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/helpdesk-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/helpdesk-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
